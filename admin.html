<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #ddd;
        }

        .tab-btn.active {
            background: #007bff;
            color: white;
        }

        .status-ok {
            color: green;
            font-weight: bold;
        }

        .status-pendente {
            color: orange;
            font-weight: bold;
        }

        input[type="number"] {
            width: 60px;
            text-align: center;
        }

        .admin-acoes {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .admin-link-auditoria {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 8px;
            background: #08284d;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            transition:
                transform 0.2s ease,
                background-color 0.2s ease;
        }

        .admin-link-auditoria:hover {
            background: #0d3b6f;
            transform: translateY(-1px);
        }

        .admin-link-auditoria:focus-visible {
            outline: 3px solid #38bdf8;
            outline-offset: 3px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🏆 Administração de Resultados</h1>

    <div class="admin-acoes">
        <a class="admin-link-auditoria" href="auditoria.html">
            🔎 Auditoria de Pontuação
        </a>
    </div>

    <div id="grupo-tabs" class="abas-grupos"></div>

    <table class="ranking">

        <thead>

            <tr>
                <th>Status</th>
                <th>Jogo</th>
                <th>Resultado Oficial</th>
            </tr>

        </thead>

        <tbody id="admin-body"></tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
